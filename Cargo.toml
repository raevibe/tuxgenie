[workspace]
resolver = "2"
members = ["crates/tuxgenie-core", "crates/tuxgenied", "crates/tuxgenie"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
